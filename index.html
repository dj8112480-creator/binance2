<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Ultimate Multi-Controller</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background-color: #181a20; color: #eaecef; padding: 20px 15px; margin: 0; }
        h1 { color: #f3ba2f; text-align: center; font-size: 22px; }
        .panel-container { max-width: 500px; margin: 0 auto; }
        .section-box { background: #2b3139; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 4px solid #f3ba2f; }
        .section-title { font-size: 15px; font-weight: bold; color: #f3ba2f; margin-bottom: 10px; border-bottom: 1px solid #474f59; padding-bottom: 5px; }
        .form-group { margin-bottom: 10px; display: flex; flex-direction: column; }
        label { font-size: 13px; color: #848e9c; margin-bottom: 4px; font-weight: 500; }
        input, select { padding: 8px 10px; border-radius: 6px; border: 1px solid #474f59; background: #1e2026; color: white; font-size: 14px; }
        .submit-btn { width: 100%; padding: 14px; background: #f3ba2f; color: #181a20; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: background 0.2s; }
        .submit-btn:hover { background: #dfa516; }
        .links-area { text-align: center; margin-top: 10px; }
        .links-area a { display: block; background: #2b3139; color: #f3ba2f; text-decoration: none; padding: 12px; margin: 10px auto; border-radius: 6px; font-weight: bold; border: 1px solid #f3ba2f; max-width: 400px; }
        .links-area a:hover { background: #f3ba2f; color: #181a20; }
    </style>
</head>
<body>

    <h1>Binance Clone Multi-Engine</h1>
    <div class="panel-container">
        
        <!-- iPhone Status Bar Control -->
        <div class="section-box">
            <div class="section-title">📱 iPhone Top Status Bar Settings</div>
            <div class="form-group">
                <label>iPhone Time (e.g., 6:30):</label>
                <input type="text" id="phoneTime" placeholder="6:30">
            </div>
            <div class="form-group">
                <label>Network Signal & Type (e.g., 4G, 5G, LTE):</label>
                <input type="text" id="netType" placeholder="4G">
            </div>
            <div class="form-group">
                <label>Battery Percentage (%):</label>
                <input type="number" id="batPct" placeholder="21">
            </div>
        </div>

        <!-- 1. Web3 Wallet Settings -->
        <div class="section-box">
            <div class="section-title">💰 1. Web3 Wallet Balance Settings</div>
            <div class="form-group">
                <label>Wallet Name (e.g., John's Wallet):</label>
                <input type="text" id="walletName" placeholder="John's Wallet">
            </div>
            <div class="form-group">
                <label>Total Balance Amount (USD):</label>
                <input type="text" id="walletBal" placeholder="42,203.19">
            </div>
        </div>

        <!-- 2. Deposit Email Notification Settings -->
        <div class="section-box">
            <div class="section-title">📩 2. Deposit Email Notification Settings</div>
            <div class="form-group">
                <label>Email Title Date (e.g., 2025-04-04):</label>
                <input type="text" id="emailTitleDate" placeholder="2025-04-04">
            </div>
            <div class="form-group">
                <label>Email Title Time (e.g., 10:43:12):</label>
                <input type="text" id="emailTitleTime" placeholder="10:43:12">
            </div>
            <div class="form-group">
                <label>Deposited USDT Amount:</label>
                <input type="text" id="emailAmt" placeholder="773.49665">
            </div>
        </div>

        <!-- 3. Withdrawal Details Settings -->
        <div class="section-box">
            <div class="section-title">📤 3. Withdrawal Details Layout Settings</div>
            <div class="form-group">
                <label>Withdraw Amount (With minus sign, e.g., -98.5):</label>
                <input type="text" id="withAmt" placeholder="-98.5">
            </div>
            <div class="form-group">
                <label>Display Total Amount (e.g., 100 USDT):</label>
                <input type="text" id="withTotalAmt" placeholder="100 USDT">
            </div>
            <div class="form-group">
                <label>Withdrawal History Date & Time:</label>
                <input type="text" id="withDate" placeholder="2026-08-09 19:45:21">
            </div>
        </div>

        <!-- এই বাটনটি নিচে যুক্ত করা হয়েছে -->
        <button class="submit-btn" onclick="saveAllSettings()">Apply & Synchronize Everything</button>

        <div class="links-area">
            <a href="crypto-wallet.html" target="_blank">🗂️ 1. Open Web3 Crypto Wallet Screen</a>
            <a href="binance-deposit-email.html" target="_blank">📬 2. Open Custom Deposit Email Screen</a>
            <a href="withdrawal-details.html" target="_blank">📤 3. Open Custom Withdrawal Screen</a>
        </div>
    </div>

    <script>
        window.onload = function() {
            document.getElementById('phoneTime').value = localStorage.getItem('p_time') || '6:30';
            document.getElementById('netType').value = localStorage.getItem('p_net') || '4G';
            document.getElementById('batPct').value = localStorage.getItem('p_bat') || '21';
            
            document.getElementById('walletName').value = localStorage.getItem('w_name') || "John's Wallet";
            document.getElementById('walletBal').value = localStorage.getItem('w_bal') || '42,203.19';
            
            document.getElementById('emailTitleDate').value = localStorage.getItem('e_tdate') || '2025-04-04';
            document.getElementById('emailTitleTime').value = localStorage.getItem('e_ttime') || '10:43:12';
            document.getElementById('emailAmt').value = localStorage.getItem('e_amt') || '773.49665';
            
            document.getElementById('withAmt').value = localStorage.getItem('wt_amt') || '-98.5';
            document.getElementById('withTotalAmt').value = localStorage.getItem('wt_tamt') || '100 USDT';
            document.getElementById('withDate').value = localStorage.getItem('wt_date') || '2026-08-09 19:45:21';
        }

        function saveAllSettings() {
            localStorage.setItem('p_time', document.getElementById('phoneTime').value);
            localStorage.setItem('p_net', document.getElementById('netType').value);
            localStorage.setItem('p_bat', document.getElementById('batPct').value);
            
            localStorage.setItem('w_name', document.getElementById('walletName').value);
            localStorage.setItem('w_bal', document.getElementById('walletBal').value);
            
            localStorage.setItem('e_tdate', document.getElementById('emailTitleDate').value);
            localStorage.setItem('e_ttime', document.getElementById('emailTitleTime').value);
            localStorage.setItem('e_amt', document.getElementById('emailAmt').value);
            
            localStorage.setItem('wt_amt', document.getElementById('withAmt').value);
            localStorage.setItem('wt_tamt', document.getElementById('withTotalAmt').value);
            localStorage.setItem('wt_date', document.getElementById('withDate').value);
            
            alert("All interface database values saved successfully!");
        }
    </script>
</body>
</html>
