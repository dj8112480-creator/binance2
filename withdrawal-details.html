<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Withdrawal Receipt View</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background-color: #000000; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .phone-canvas { width: 100%; max-width: 412px; min-height: 100vh; background-color: #181a20; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .status-bar { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 14px; font-weight: 600; color: #ffffff; }
        .status-right { display: flex; align-items: center; gap: 5px; }
        .net-icon-badge { font-size: 10px; background: #ffffff; color: #000000; padding: 1px 3px; border-radius: 3px; font-weight: bold; }
        .battery-shell { width: 22px; height: 11px; border: 1px solid #ffffff; border-radius: 3px; display: flex; align-items: center; padding: 1px; }
        .battery-core-fill { height: 100%; background-color: #ffffff; border-radius: 1px; }
        .app-header-navigation-row { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b3139; }
        .withdrawal-summary-hero-card { text-align: center; padding: 25px 16px; }
        .hero-amount-display-value { font-size: 30px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
        .status-completed-pill-tag { color: #0ecb81; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 12px; }
        .with-data-list { padding: 5px 16px; }
        .with-data-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #2b3139; font-size: 13.5px; }
        .wt-lbl { color: #848e9c; }
        .wt-val { color: #ffffff; font-weight: 500; text-align: right; }
        .action-button-full-width-yellow { display: block; text-align: center; background: #f3ba2f; color: #181a20; font-weight: 700; text-decoration: none; padding: 13px; border-radius: 6px; font-size: 14px; margin: 30px 16px; }
    </style>
</head>
<body>
    <div class="phone-canvas">
        <div class="status-bar">
            <span id="wtTime">6:54</span>
            <div class="status-right">
                <span class="net-icon-badge" id="wtNet">4G</span>
                <span id="wtBatNum">21%</span>
                <div class="battery-shell"><div class="battery-core-fill" id="wtBatFill"></div></div>
            </div>
        </div>
        <div class="app-header-navigation-row"><span>←</span><span style="font-size:17px; font-weight:700;">Withdrawal Details</span><span style="visibility:hidden;">→</span></div>
        <div class="withdrawal-summary-hero-card">
            <div class="hero-amount-display-value" id="dspWithAmt">-98.5 USDT</div>
            <div class="status-completed-pill-tag">✓ Completed</div>
            <div style="color:#848e9c; font-size:12px; line-height:1.5; padding:0 10px;">Crypto transferred out of Binance. Please contact the recipient platform for your transaction receipt.</div>
        </div>
        <div class="with-data-list">
            <div class="with-data-row"><span class="wt-lbl">Network</span><span class="wt-val">TRX</span></div>
            <div class="with-data-row"><span class="wt-lbl">Address</span><span class="wt-val" style="font-family:monospace; font-size:13px;">TX7afK9RjMvC5zHqE7bHn2C6eK5d4cfr... 📋</span></div>
            <div class="with-data-row"><span class="wt-lbl">Amount</span><span class="wt-val" id="dspWithTotalAmt">100 USDT</span></div>
            <div class="with-data-row"><span class="wt-lbl">Network fee</span><span class="wt-val">1.5 TRX</span></div>
            <div class="with-data-row"><span class="wt-lbl">Date</span><span class="wt-val" id="dspWithDate">2026-08-09 19:45:21</span></div>
        </div>
        <a href="#" class="action-button-full-width-yellow">Withdraw Again</a>
    </div>
    <script>
        window.onload = function() {
            document.getElementById('wtTime').innerText = localStorage.getItem('p_time') || '6:54';
            document.getElementById('wtNet').innerText = localStorage.getItem('p_net') || '4G';
            var bat = localStorage.getItem('p_bat') || '21';
            document.getElementById('wtBatNum').innerText = bat + "%";
            document.getElementById('wtBatFill').style.width = bat + "%";
            document.getElementById('dspWithAmt').innerText = localStorage.getItem('wt_hamt') || '-98.5 USDT';
            document.getElementById('dspWithTotalAmt').innerText = localStorage.getItem('wt_tamt') || '100 USDT';
            document.getElementById('dspWithDate').innerText = localStorage.getItem('wt_date') || '2026-08-09 19:45:21';
        }
    </script>
</body>
</html>
