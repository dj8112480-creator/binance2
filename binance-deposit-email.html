<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Email Notification</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; background-color: #121214; color: #ffffff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .phone-canvas { width: 100%; max-width: 412px; min-height: 100vh; background-color: #121214; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.6); }
        .status-bar { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 14px; font-weight: 600; color: #ffffff; }
        .bar-right { display: flex; align-items: center; gap: 5px; }
        .net-tag { font-size: 10px; background: #ffffff; color: #000000; padding: 1px 3px; border-radius: 3px; font-weight: bold; }
        .bat-box { width: 22px; height: 11px; border: 1px solid #ffffff; border-radius: 3px; display: flex; align-items: center; padding: 1px; }
        .bat-fill { height: 100%; background-color: #ffffff; border-radius: 1px; }
        .gmail-bar { padding: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
        .mail-padding { padding: 15px 20px; flex-grow: 1; }
        .subject { font-size: 19px; font-weight: 500; color: #ffffff; line-height: 1.4; margin-bottom: 20px; }
        .sender-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .avatar { width: 40px; height: 40px; background: #b366ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; color: white; }
        .mail-card { background: #1e2026; border-radius: 4px; overflow: hidden; border: 1px solid #2b3139; }
        .mail-header { padding: 18px; text-align: center; background: #181a20; color: #f3ba2f; font-weight: 800; letter-spacing: 2px; }
        .mail-body { padding: 25px 20px; }
        .mail-btn { display: inline-block; background: #f3ba2f; color: #181a20; text-decoration: none; font-weight: 700; padding: 12px 24px; border-radius: 4px; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="phone-canvas">
        <!-- ✍️ আইফোনের টাইম, চার্জ এখানে বদলাবেন -->
        <div class="status-bar">
            <span>7:50</span>
            <div class="bar-right">
                <span class="net-tag">4G</span>
                <span>25%</span>
                <div class="bat-box"><div class="bat-fill" style="width: 25%;"></div></div>
            </div>
        </div>

        <div class="gmail-bar"><div>←</div><div style="display:flex; gap:22px; font-size:16px;"><span>📥</span> <span>🗑</span> <span>✉</span> <span>⋮</span></div></div>
        
        <div class="mail-padding">
            <!-- ✍️ ইমেইল টাইটেল ডেট এখানে বদলাবেন -->
            <div class="subject">[Binance] USDT Deposit Confirmed - 2025-04-04 10:43:12 (UTC)</div>
            
            <div class="sender-row">
                <div style="display:flex; gap:12px; align-items:center;">
                    <div class="avatar">B</div>
                    <div><div style="font-size:15px; font-weight:600;">Binance <span style="font-size:12px; color:#848e9c; font-weight:400;">Today</span></div><div style="font-size:13px; color:#848e9c; margin-top:2px;">to me ▾</div></div>
                </div>
                <div style="display:flex; gap:20px; color:#848e9c; font-size:14px;"><span>☺</span> <span>↩</span> <span>⋮</span></div>
            </div>

            <div class="mail-card">
                <div class="mail-header">🔶 BINANCE</div>
                <div class="mail-body">
                    <div style="font-size:20px; font-weight:700; margin-bottom:20px;">USDT Deposit Successful</div>
                    <!-- ✍️ ডিপোজিট ডলারের পরিমাণ এখানে বদলাবেন -->
                    <div style="font-size:14px; color:#eaecef; line-height:1.6; margin-bottom:30px;">Your deposit of <span style="font-weight:700; color:#ffffff;">20,000.00</span> USDT is now available in your Binance account. Log in to check your balance.</div>
                    <div class="mail-btn">Visit Your Dashboard</div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
